name: finn-development
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length_on_error=0", "-c", "log_statement=none"]
    environment:
      POSTGRES_DB: finn
      POSTGRES_USER: finn_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/finn_admin_password
    ports:
      - "127.0.0.1:${FINN_LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - ${FINN_WORKSPACE_ROOT:?Set an external FINN_WORKSPACE_ROOT}/data/postgres:/var/lib/postgresql
      - ./deployment/postgres/10-create-roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
      - ./deployment/postgres/20-create-identity.sh:/docker-entrypoint-initdb.d/20-create-identity.sh:ro
    secrets:
      - finn_admin_password
      - finn_app_password
      - finn_migration_password
      - finn_identity_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finn_bootstrap -d finn"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"
  identity:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
    entrypoint: ["/bin/bash", "/opt/finn/start.sh"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${FINN_LOCAL_IDENTITY_DATABASE:-finn_identity}
      KC_DB_USERNAME: finn_identity
      KC_BOOTSTRAP_ADMIN_USERNAME: finn-local-admin
      KC_HOSTNAME: http://localhost:${FINN_LOCAL_IDENTITY_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: -Xms64m -Xmx384m
    ports:
      - "127.0.0.1:${FINN_LOCAL_IDENTITY_PORT:-8180}:8080"
    volumes:
      - ./deployment/identity/start.sh:/opt/finn/start.sh:ro
      - ${FINN_WORKSPACE_ROOT}/secrets/identity/finn-local-realm.json:/opt/keycloak/data/import/finn-local-realm.json:ro
    secrets:
      - finn_identity_password
      - finn_identity_admin_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    mem_limit: 768m
    restart: "no"
secrets:
  finn_admin_password:
    file: ${FINN_WORKSPACE_ROOT}/secrets/postgres-admin-password
  finn_app_password:
    file: ${FINN_WORKSPACE_ROOT}/secrets/backend/spring.datasource.password
  finn_migration_password:
    file: ${FINN_WORKSPACE_ROOT}/secrets/backend/spring.flyway.password
  finn_identity_password:
    file: ${FINN_WORKSPACE_ROOT}/secrets/identity-postgres-password
  finn_identity_admin_password:
    file: ${FINN_WORKSPACE_ROOT}/secrets/identity-admin-password
