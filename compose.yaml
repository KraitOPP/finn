name: finn-development
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_DB: finn
      POSTGRES_USER: finn_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/finn_admin_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ${FINN_WORKSPACE_ROOT:?Set an external FINN_WORKSPACE_ROOT}/data/postgres:/var/lib/postgresql
      - ./deployment/postgres/10-create-roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    secrets:
      - finn_admin_password
      - finn_app_password
      - finn_migration_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finn_bootstrap -d finn"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"
secrets:
  finn_admin_password:
    file: ${FINN_WORKSPACE_ROOT}/secrets/postgres-admin-password
  finn_app_password:
    file: ${FINN_WORKSPACE_ROOT}/secrets/backend/spring.datasource.password
  finn_migration_password:
    file: ${FINN_WORKSPACE_ROOT}/secrets/backend/spring.flyway.password
