spring:
  application:
    name: finn-backend
  main:
    banner-mode: "off"
  kafka:
    bootstrap-servers: ${FINN_KAFKA_BOOTSTRAP:127.0.0.1:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 2500
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        allow.auto.create.topics: false
        max.poll.records: 100
    listener:
      ack-mode: record
    admin:
      properties:
        request.timeout.ms: 5000
        default.api.timeout.ms: 10000
  config:
    import: "optional:configtree:${FINN_WORKSPACE_ROOT}/secrets/backend/"
  datasource:
    url: ${FINN_DB_URL:jdbc:postgresql://127.0.0.1:55432/finn?currentSchema=finn}
    username: finn_app
    password: ${FINN_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    user: finn_migrator
    password: ${FINN_DB_MIGRATION_PASSWORD:}
    default-schema: finn
    create-schemas: false
    clean-disabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      enabled: false
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: finn.spring_session
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    log-request-details: false
finn:
  filings:
    kafka:
      enabled: ${FINN_FILINGS_KAFKA_ENABLED:false}
      topic: ${FINN_FILINGS_KAFKA_TOPIC:finn.reviewed-company-events.v1}
      group-prefix: ${FINN_FILINGS_KAFKA_GROUP:finn-reviewed-v1}
      concurrency: ${FINN_FILINGS_KAFKA_CONCURRENCY:2}
      replication-factor: ${FINN_KAFKA_REPLICATION_FACTOR:1}
  metrics:
    enabled: ${FINN_METRICS_ENABLED:false}
  public-origin: ${FINN_PUBLIC_ORIGIN:}
  oidc:
    issuer: ${FINN_OIDC_ISSUER:}
    client-secret: ${FINN_OIDC_CLIENT_SECRET:}
server:
  address: 127.0.0.1
  port: 8080
  max-http-request-header-size: 16KB
  tomcat:
    threads:
      max: 48
    max-connections: 128
    accept-count: 32
    max-http-form-post-size: 64KB
    max-swallow-size: 5MB
    connection-timeout: 10s
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: ${FINN_ACTUATOR_ENDPOINTS:health}
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
