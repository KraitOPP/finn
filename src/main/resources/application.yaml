spring:
  application:
    name: finn-backend
  main:
    banner-mode: "off"
  config:
    import: "optional:configtree:${FINN_WORKSPACE_ROOT}/secrets/backend/"
  datasource:
    url: ${FINN_DB_URL:jdbc:postgresql://127.0.0.1:55432/finn?currentSchema=finn}
    username: finn_app
    password: ${FINN_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    user: finn_migrator
    password: ${FINN_DB_MIGRATION_PASSWORD:}
    default-schema: finn
    create-schemas: false
    clean-disabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      enabled: false
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: finn.spring_session
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    log-request-details: false
finn:
  public-origin: ${FINN_PUBLIC_ORIGIN:}
  oidc:
    issuer: ${FINN_OIDC_ISSUER:}
    client-secret: ${FINN_OIDC_CLIENT_SECRET:}
server:
  address: 127.0.0.1
  port: 8080
  max-http-request-header-size: 16KB
  tomcat:
    threads:
      max: 48
    max-connections: 128
    accept-count: 32
    max-http-form-post-size: 64KB
    max-swallow-size: 5MB
    connection-timeout: 10s
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
